name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches: [main]
    workflow_dispatch: {}

permissions:
    actions: read
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    main:
        runs-on: ubuntu-latest
        # The measured warm run is about 6.5 minutes; allow cold install and browser setup.
        timeout-minutes: 25

        # CI + npm network behavior
        env:
            CI: true
            NPM_CONFIG_FETCH_RETRIES: '5'
            NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000' # 20s
            NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000' # 120s
            NPM_CONFIG_TIMEOUT: '600000' # 10m
            NPM_IGNORE_SCRIPTS: 'false' # set to 'true' for diagnostic install

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  filter: tree:0
                  fetch-depth: 0

            # Cache npm downloads for the lockfile install.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.22.0
                  cache: 'npm'

            - run: npm ci
            - run: npx playwright install --with-deps
            - run: npm run check:use-cases
            - run: npm run format:check

            - run: npm run ci:hook
            - run: npm run coverage:api
            - name: Retain browser test diagnostics
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: browser-test-diagnostics
                  path: |
                      apps/web-e2e/test-output/
                      apps/api-e2e/test-output/lifecycle/
                  if-no-files-found: ignore
                  retention-days: 7
