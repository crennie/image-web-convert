name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches: [main]
    workflow_dispatch: {} # allow manual runs with toggles if needed

permissions:
    actions: read
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    main:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        # CI + npm network behavior
        env:
            CI: true
            NPM_CONFIG_FETCH_RETRIES: '5'
            NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000' # 20s
            NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000' # 120s
            NPM_CONFIG_TIMEOUT: '600000' # 10m
            NPM_IGNORE_SCRIPTS: 'false' # set to 'true' for diagnostic install

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  filter: tree:0
                  fetch-depth: 0

            # Cache node_modules
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.22.0
                  cache: 'npm'

            - run: npm ci
            - run: npx playwright install --with-deps
            - run: npm run check:use-cases

            - run: npm run ci:hook
            - name: Retain browser test diagnostics
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: browser-test-diagnostics
                  path: |
                      apps/web-e2e/test-output/
                      apps/api-e2e/test-output/lifecycle/
                  if-no-files-found: ignore
                  retention-days: 7
